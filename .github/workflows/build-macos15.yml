name: Build for macOS 15

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Compositor (macOS 15+ Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Extract marketing version
        run: |
          VERSION=$(awk -F' = ' '/MARKETING_VERSION = /{print $2; exit}' Compositor.xcodeproj/project.pbxproj | tr -d '; ')
          echo "VERSION=${VERSION:-1.5.2}" >> $GITHUB_ENV
          echo "Building version: ${VERSION:-1.5.2}"

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Compositor.xcodeproj \
            -scheme Compositor

      - name: Build Release (arm64)
        run: |
          xcodebuild build \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_CODE_COVERAGE=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0

      - name: Re-sign App and Frameworks deeply
        run: |
          codesign --force --deep --sign - DerivedData/Build/Products/Release/Compositor.app

      - name: Package App as Zip
        run: |
          cd DerivedData/Build/Products/Release
          ditto -c -k --keepParent Compositor.app Compositor-macOS15-arm64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-macOS15-arm64
          path: DerivedData/Build/Products/Release/Compositor-macOS15-arm64.zip
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-macos15
          name: Compositor ${{ env.VERSION }} 简体中文版 (支持 macOS 15 / Apple Silicon)
          draft: false
          prerelease: false
          body: |
            ## Compositor ${{ env.VERSION }} 简体中文版 (macOS 15 / Apple Silicon)

            本项目基于 Robbie Tilton 开源的图像编辑软件 Compositor（遵循 MIT 许可证）。

            原版 Compositor 官方目前面向 macOS 26 及以上系统。本仓库提供了针对 macOS 15（Sequoia）的向下兼容适配，并集成了简体中文本地化。

            ### 主要改动

            1. 系统兼容：降低部署目标至 macOS 15.0，对新系统特有的工具栏与控件 API 做了兼容回退，支持在搭载 Apple Silicon 芯片（M1 - M4）且运行 macOS 15 的设备上正常运行。
            2. 简体中文：集成社区提供的简体中文本地化（参考 PR #274 by Inefy-03），翻译了工具、图层、混合模式、Camera Raw 调色面板和快捷键等界面内容，并保留应用内语言切换选项。
            3. 签名修复：调整了 entitlements 配置并补充递归签名，避免 Sparkle 等动态库在非官方签名环境下因 Team ID 校验失败而闪退。

            ### 运行说明

            1. 下载下方的 Compositor-macOS15-arm64.zip 并解压。
            2. 将 Compositor.app 拖入「应用程序」文件夹。
            3. 由于属于个人开源构建，未购买商业开发者证书，首次启动需右键（或按住 Control 点击）Compositor.app 选择「打开」，并在弹窗中确认一次即可。

            ### 致谢与开源协议

            - 原项目：https://github.com/robbietilton/Compositor
            - 原作者：Robbie Tilton
            - 遵循原项目的 MIT 许可证。
          files: |
            DerivedData/Build/Products/Release/Compositor-macOS15-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
