name: Build for macOS 15

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Compositor (macOS 15+ Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Extract marketing version
        run: |
          VERSION=$(awk -F' = ' '/MARKETING_VERSION = /{print $2; exit}' Compositor.xcodeproj/project.pbxproj | tr -d '; ')
          echo "VERSION=${VERSION:-1.5.2}" >> $GITHUB_ENV
          echo "Building version: ${VERSION:-1.5.2}"

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Compositor.xcodeproj \
            -scheme Compositor

      - name: Build Release (arm64)
        run: |
          xcodebuild build \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_CODE_COVERAGE=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0

      - name: Re-sign App and Frameworks deeply
        run: |
          codesign --force --deep --sign - DerivedData/Build/Products/Release/Compositor.app

      - name: Package App as Zip
        run: |
          cd DerivedData/Build/Products/Release
          ditto -c -k --keepParent Compositor.app Compositor-macOS15-arm64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-macOS15-arm64
          path: DerivedData/Build/Products/Release/Compositor-macOS15-arm64.zip
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-macos15
          name: Compositor ${{ env.VERSION }} 简体中文版 (支持 macOS 15 / Apple Silicon)
          draft: false
          prerelease: false
          body: |
            ## Compositor ${{ env.VERSION }} 原生中文版（支持 macOS 15+ / Apple Silicon）

            Compositor 是一款专为 Mac 打造的高性能开源图像处理与合成软件，旨在成为 **Adobe Photoshop 的免费、轻量、现代化替代品**。

            本版本为 **macOS 15 Sequoia 及更高版本（Apple Silicon M 系列芯片）** 的专门适配汉化版。

            ---

            ### ✨ 本版本特性

            - 🇨🇳 **全面深度中文化**：集成完整简体中文汉化包（1300+ 词条），覆盖菜单、工具箱、图层面板、混合模式、Camera Raw 调色、滤镜及快捷键；
            - 🌐 **内置多语言切换**：支持在应用内自由切换「跟随系统」、「English」与「简体中文」；
            - ⚡️ **向下兼容 macOS 15**：解除原版对 macOS 26 的系统限制，支持 macOS 15.0+ 运行；
            - 🚀 **Apple Silicon 原生加速**：基于 Metal GPU 硬件渲染管线优化，完美支持 M1 / M2 / M3 / M4 系列 Mac；
            - 🛡️ **安全加固**：预置动态库签名隔离策略，彻底解决第三方运行时崩溃问题。

            ---

            ### 🖥️ 系统与硬件要求

            - **操作系统**：macOS 15.0 或更高版本
            - **硬件芯片**：Apple Silicon（M1 / M2 / M3 / M4 系列芯片）

            ---

            ### 📦 安装与首次启动指引

            1. 点击下方附件直接下载 **`Compositor-macOS15-arm64.zip`**；
            2. 双击解压后，将 **`Compositor.app`** 拖移至访达中的 **`/Applications`（应用程序）** 文件夹；
            3. **首次打开方式**：
               - 由于本版本为开源自编译版本（无商业付费证书），首次打开时请 **按住 Control 键点击应用（或右键）选择「打开」**；
               - 在弹出的系统安全确认对话框中点击 **「打开」** 即可。之后便可直接双击正常启动。
          files: |
            DerivedData/Build/Products/Release/Compositor-macOS15-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
